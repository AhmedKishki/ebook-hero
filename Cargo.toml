[package]
name = "ebook-hero"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AhmedKishki/ebook-hero"
description = "Search and read one PDF or EPUB: lexical, semantic and hybrid search, with locators and quote verification, as a CLI and an MCP server."

[dependencies]
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
