[package]
name = "ebook-hero"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AhmedKishki/ebook-hero"
description = "Search and read one PDF or EPUB: lexical, semantic and hybrid search, with locators and quote verification, as a CLI and an MCP server."

[dependencies]
dirs = "7"
fs4 = "1.1"
pdf_oxide = "=0.3.78"
rbook = "0.7.12"
schemars = "1.2"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tantivy = "0.27"
thiserror = "2"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13"
zip = { version = "9.2", default-features = false }

[dev-dependencies]
tempfile = "3.27"
