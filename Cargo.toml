[package]
name = "ebook-hero"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/AhmedKishki/ebook-hero"
keywords = ["pdf", "epub", "search", "mcp", "cli"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["gui/", "evals/", "assets/", ".github/", "AGENTS.md", "CLAUDE.md"]
description = "Search and read one PDF or EPUB: lexical, semantic and hybrid search, with locators and quote verification, as a CLI and an MCP server."

[[bin]]
name = "ebook-hero"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
concept-map = "0.1"
dirs = "7"
fastembed = { version = "7.5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
fs4 = "1.1"
furniture-detection = "0.1"
libc = "0.2"
pdf_oxide = "=0.3.78"
rbook = "0.7.12"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tantivy = "0.27"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13"
zip = { version = "9.2", default-features = false }

[dev-dependencies]
assert_cmd = "2.2"
rmcp = { version = "3.8", features = ["client", "transport-child-process"] }
tempfile = "3.27"
tokio = { version = "1.54", features = ["io-util", "process", "time"] }
